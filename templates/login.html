<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - CloudVault Lite</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
<main class="login-card">
  <div class="login-head">
    <div class="logo-tile">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7FD8D2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><rect x="9" y="10.5" width="6" height="5" rx="1"/><path d="M10.5 10.5V9a1.5 1.5 0 0 1 3 0v1.5"/></svg>
    </div>
    <h1>Sign in to CloudVault Lite</h1>
    <p class="muted">Your files stay private in your own S3 bucket.</p>
  </div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="username">Email</label>
      <input id="username" name="username" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p id="login-error" class="form-error" role="alert"></p>
    <button id="login-btn" class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>

  <p class="footnote">Passwords are stored as salted hashes, and files are only reachable through short-lived download links.</p>
</main>
<script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
