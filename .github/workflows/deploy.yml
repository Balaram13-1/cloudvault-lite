name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # lets the deploy job request a short-lived AWS token (OIDC)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t cloudvault-lite .

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Get short-lived AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Redeploy through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CloudVault Lite deploy ${GITHUB_SHA::7}" \
            --parameters '{"commands":["sudo -u ubuntu -H git -C /home/ubuntu/cloudvault-lite pull --ff-only origin main && sudo -u ubuntu -H bash /home/ubuntu/cloudvault-lite/deploy.sh"]}' \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          if aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"; then
            RESULT=ok
          else
            RESULT=failed
          fi

          echo "---- server output ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "[Status, StandardOutputContent, StandardErrorContent]" --output text
          echo "-----------------------"

          [ "$RESULT" = "ok" ]
